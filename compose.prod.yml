services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: gitgalaxy-postgres-prod
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gitgalaxy-redis-dev
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: gitgalaxy-backend-prod
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-credentials.json
    volumes:
      - ./gcp-credentials.json:/app/gcp-credentials.json:ro
    ports:
      - "8080:8080"
  nginx:
          image: nginx:alpine
          container_name: gitgalaxy-nginx
          ports:
            - "80:80"
            - "443:443"
          volumes:
            - ./nginx/conf.d:/etc/nginx/conf.d
            - ./certbot/conf:/etc/letsencrypt
            - ./certbot/www:/var/www/certbot
          depends_on:
            - backend

  certbot:
            image: certbot/certbot
            volumes:
              - ./certbot/conf:/etc/letsencrypt
              - ./certbot/www:/var/www/certbot

  prometheus:
    image: prom/prometheus:latest
    container_name: gitgalaxy-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: gitgalaxy-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-prod-data:
  grafana-data:

