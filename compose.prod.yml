x-backend: &backend
  build: .
  image: gitgalaxy-backend:latest
  restart: unless-stopped
  # 종료 신호를 받으면 진행 중인 요청·정시 작업(수집 최대 수 분)을 마치고 내려가도록 넉넉히
  stop_grace_period: 11m
  depends_on:
    postgres:
      condition: service_started
    redis:
      condition: service_started
    elasticsearch:
      condition: service_healthy
  env_file:
    - .env
  environment:
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT}
    DB_NAME: ${DB_NAME}
    DB_USERNAME: ${DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD}
    REDIS_HOST: ${REDIS_HOST}
    ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-elasticsearch}
    GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-key.json
  volumes:
    - ./gcp-key.json:/app/gcp-key.json:ro

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: gitgalaxy-postgres-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gitgalaxy-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    container_name: gitgalaxy-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'yellow\\|green'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # 블루-그린 무중단 배포: 같은 이미지를 두 색으로 띄우고 Nginx가 한쪽으로만 트래픽을 보냄 (scripts/deploy-blue-green.sh)
  backend-blue:
    <<: *backend
    container_name: gitgalaxy-backend-blue
    ports:
      - "127.0.0.1:8081:8080"   # 헬스체크용, 외부 노출 없음 (외부 요청은 Nginx로만)

  backend-green:
    <<: *backend
    container_name: gitgalaxy-backend-green
    ports:
      - "127.0.0.1:8082:8080"

  nginx:
          image: nginx:alpine
          container_name: gitgalaxy-nginx
          ports:
            - "80:80"
            - "443:443"
          volumes:
            - ./nginx/conf.d:/etc/nginx/conf.d
            - ./certbot/conf:/etc/letsencrypt
            - ./certbot/www:/var/www/certbot
          restart: unless-stopped

  certbot:
            image: certbot/certbot
            volumes:
              - ./certbot/conf:/etc/letsencrypt
              - ./certbot/www:/var/www/certbot

  prometheus:
    image: prom/prometheus:latest
    container_name: gitgalaxy-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: gitgalaxy-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-prod-data:
  grafana-data:

