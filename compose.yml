services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: gitgalaxy-postgres-dev
    environment:
      POSTGRES_DB: gitgalaxy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      # 다른 프로젝트가 5432를 쓰면 POSTGRES_HOST_PORT=5433 처럼 바꿔서 실행 (앱은 DB_PORT로 맞춤)
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine
    container_name: gitgalaxy-redis-dev
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    container_name: gitgalaxy-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'yellow\\|green'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  backend:
    build: .
    container_name: gitgalaxy-backend-dev
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      REDIS_HOST: redis
      ELASTICSEARCH_HOST: elasticsearch
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-key.json
    volumes:
      - ./gcp-key.json:/app/gcp-key.json:ro
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:latest
    container_name: gitgalaxy-prometheus
    volumes:
      - ./prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    # 로컬은 bootRun으로 앱을 띄우므로 backend 컨테이너에 의존하지 않음
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: gitgalaxy-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      # 3000을 다른 앱(Next.js 등)이 쓰면 GRAFANA_HOST_PORT=3001 처럼 바꿔서 실행
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - postgres

volumes:
  postgres-dev-data:
  grafana-data: