services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: gitgalaxy-postgres-dev
    environment:
      POSTGRES_DB: gitgalaxy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine
    container_name: gitgalaxy-redis-dev
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: gitgalaxy-backend-dev
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      REDIS_HOST: redis
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-credentials.json
    volumes:
      - ./gcp-credentials.json:/app/gcp-credentials.json:ro
    ports:
      - "8080:8080"

volumes:
  postgres-dev-data: