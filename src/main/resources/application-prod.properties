app.frontend-url=${FRONTEND_URL:https://frontend-three-delta-41.vercel.app}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/gitgalaxy
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

springdoc.swagger-ui.path=/swagger

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=6379

springdoc.api-docs.path=/v3/api-docs
server.forward-headers-strategy=framework

# ??? ??? ?? ?? ?? (Vercel ? EC2 ? ??? ??)
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true


spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=${SCOPE}

github.collector.token=${GITHUB_TOKEN}

github.collector.output-dir=output
github.collector.skip-existing=true


github.collector.max-retries=3
github.collector.retry-delay-ms=1000
github.collector.cron-expression=-

vertexai.project=gitgalaxy-495508
vertexai.location=us-central1
vertexai.model=gemini-2.5-flash
vertexai.embedding-model=text-embedding-004


spring.elasticsearch.uris=http://${ELASTICSEARCH_HOST:elasticsearch}:9200

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=gitgalaxy-backend