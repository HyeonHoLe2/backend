spring.application.name=backend

# schema.sql 매 시작 시 실행 (IF NOT EXISTS 로 멱등성 보장)
spring.sql.init.mode=always

# Hibernate DDL 실행 후 schema.sql 실행
spring.jpa.defer-datasource-initialization=true
server.port=8080
# 은하 화면 응답(배경 repo 수천 개 JSON) 압축
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=2048

spring.datasource.url=jdbc:postgresql://localhost:5432/gitgalaxy
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=${SCOPE}
# ─── GitHub Doc Collector ───────────────────────────────
# GITHUB_TOKEN 환경변수로 주입 (미설정 시 batch job skip)
github.collector.token=${GITHUB_TOKEN}

# repo 목록 파일 경로 (프로젝트 루트 기준, .json 또는 .csv)

# JSONL 출력 디렉토리
github.collector.output-dir=output

# 이미 수집된 repo skip
github.collector.skip-existing=true

# 재시도 횟수 / 첫 대기시간(ms) → exponential backoff
github.collector.max-retries=3
github.collector.retry-delay-ms=1000

# cron 표현식 (Spring 형식: 초 분 시 일 월 요일)
# 0 0 * * * *     → 매 시각 정각 (1시간마다)
# 0 0 9 * * *     → 매일 오전 9시
# 0 0 */6 * * *   → 6시간마다

github.collector.cron-expression=0 0 * * * *

# ─── GH Archive ──────────────────────────────────────
gharchive.base-url=https://data.gharchive.org
# 은하 배경 repo: 1시간 내 push N회 이상 AND issue 이벤트 N회 이상인 미추적 repo를 가볍게 등록 (GraphQL 메타만, 임베딩 없음)
# issue 0 → push만 있어도 후보. 활동량(push+issue) 많은 순으로 시간당 상한까지
gharchive.min-pushes-for-discovery=1
gharchive.min-issues-for-discovery=0
gharchive.max-discovery-per-hour=1000
# 추적 repo push 커밋 조회 (GitHub compare API) 시간당 / repo당 상한
gharchive.max-commit-fetch-per-hour=1500
gharchive.max-commit-fetch-per-repo=10
# 커밋 조회 동시 요청 수 (순차 1,500회 약 17분 → 병렬)
gharchive.commit-fetch-concurrency=4

# ─── 일간 트렌딩 (UTC 하루 스타 증가량 S1 − S0) ─────────
# 매시간 스냅샷 후보: 당일 GH Archive 스타 상위 N개 (GraphQL 100개당 1회 호출)
trending.daily.candidate-limit=500
trending.daily.min-archive-stars=1
trending.daily.top-n=100
# 상위 N개는 repos에 온보딩하고 다음날에도 계속 스냅샷
trending.daily.featured-top=100
trending.daily.retention-days=8
# 정각 스냅샷 (UTC). 수집 배치와 동시에 돌 수 있게 스케줄러 스레드 2개
trending.daily.snapshot-cron=0 0 * * * *
spring.task.scheduling.pool.size=3

# ─── repo 보관 정책 (UTC 하루 확정 직후 실행) ─────────────
# 최근 N일 동안 일간 트렌딩 rank-cutoff 안에 한 번도 못 든 repo + 임베딩·지표·요약 삭제 (즐겨찾기 보호)
# 트렌딩 기록이 N일치 쌓이기 전에는 삭제 보류
# 기존 수집 repo(약 6,200개) 유지를 위해 현재 비활성화. 켜면 트렌딩 순위권 밖 repo가 모두 삭제 대상
trending.retention.enabled=false
trending.retention.window-days=7
trending.retention.rank-cutoff=100

# ─── Repo 메타 갱신 ───────────────────────────────────
# 매 시각 40분, 가장 오래전에 수집된 추적 repo N개의 스타·포크 등 갱신
# GitHub API 예산(5000/h): 온보딩 300 + 커밋 1500 + 메타 1000
github.collector.meta-refresh-batch-size=1000
github.collector.meta-refresh-cron=0 40 * * * *
# 매 시각 10분 후 (GH Archive 업로드 대기 후 실행)
gharchive.cron-expression=0 10 * * * *





vertexai.project=gitgalaxy-498305
vertexai.location=us-central1
vertexai.model=gemini-2.5-flash
vertexai.embedding-model=text-embedding-004


# 외부 API 동시 호출 수 (GraphQL 프로필 25개 묶음 / Vertex 임베딩 20개 묶음)
github.collector.graphql-concurrency=4
vertexai.embedding-concurrency=4

# 무중단 배포: 종료 신호를 받으면 새 요청은 받지 않고 진행 중인 요청을 마친 뒤 종료,
# 실행 중인 정시 작업(수집 등)은 끝날 때까지 대기 (compose stop_grace_period 11m 안에서)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=10m
# /actuator/health/readiness: 기동이 끝나 트래픽을 받을 준비가 됐는지 (배포 스크립트가 전환 전에 확인)
management.endpoint.health.probes.enabled=true

# ─── RAG 답변 캐시 (Redis) ─────────────────────────────
# 레포 문서가 다시 임베딩되면 버전을 올려 즉시 무효화, 그 외에는 TTL로 만료
rag.cache.ttl=1h
# Redis 장애 시 요청이 오래 묶이지 않도록 짧게 (실패하면 캐시 없이 진행)
spring.data.redis.timeout=300ms
spring.data.redis.connect-timeout=300ms
