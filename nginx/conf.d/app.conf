server {
    listen 80;
    server_name api.gitgalaxy.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.gitgalaxy.org;

    ssl_certificate /etc/letsencrypt/live/api.gitgalaxy.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gitgalaxy.org/privkey.pem;

    location / {
        proxy_pass http://backend;   # upstream은 00-backend-upstream.conf (배포 스크립트가 활성 색으로 작성)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout    120s;
    }
}
